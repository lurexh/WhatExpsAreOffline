name: Refresh API

on:
  schedule:
    - cron: '0 */6 * * *'
  push:
    branches: [main]
    paths-ignore:
      - 'public/api/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build API + log snapshot
        run: node scripts/log-snapshot.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

      - name: Commit API files
        run: |
          git config user.name "weao-bot"
          git config user.email "bot@users.noreply.github.com"
          git add public/api/
          git diff --staged --quiet || git commit -m "api refresh $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
